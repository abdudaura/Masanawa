name: Masana Android APK Compilation
on:
  pull_request:
    paths:
      - "apps/mobile/assets/masana/**"
      - "apps/mobile/lib/src/agents/masana_portrait_avatar.dart"
      - "apps/mobile/pubspec.yaml"
      - "adapters/storage/postgres/src/masana/catalog_lessons.ts"
      - ".github/workflows/masana-android-apk.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/masana-android-apk.yml"
      - "apps/mobile/assets/masana/**"
      - "apps/mobile/pubspec.yaml"
permissions:
  contents: read
jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Verify all 26 packaged persona portraits
        run: flutter test --no-pub test/masana_professional_portraits_test.dart test/agent_directory_readiness_test.dart test/features/rooms/room_auto_answer_test.dart
      # Independent from the existing whole-project analyzer debt. The
      # Mobile Build workflow still reports those issues and remains required
      # for clean release qualification; this job proves an actual APK.
      - name: Compile Android release APK for handset testing
        run: >-
          flutter build apk --release --no-pub
          --dart-define=API_BASE_URL=https://masanawa-gateway-production.up.railway.app
          --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production.up.railway.app
      - name: Inspect APK result
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Preserve compiled handset APK
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-26-masana-handset-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
