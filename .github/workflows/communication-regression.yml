name: Masanawa Chat Voice and Calls Regression

on:
  pull_request:
    paths:
      - "apps/mobile/lib/src/screens/chat/**"
      - "apps/mobile/lib/src/core/voice_note_recorder.dart"
      - "apps/mobile/lib/src/core/live_voice_session.dart"
      - "apps/mobile/lib/src/core/live_pcm_audio.dart"
      - "apps/mobile/lib/src/ui/components/voice_note_composer.dart"
      - "apps/mobile/lib/src/agents/masanawa_transport.dart"
      - "apps/mobile/lib/src/state/ai_chat_state.dart"
      - "apps/mobile/lib/src/calls/**"
      - "apps/mobile/test/voice_note*"
      - "apps/mobile/test/live_voice*"
      - "apps/mobile/test/ai_chat*"
      - "services/gateway/src/agent_conversation*"
      - "services/gateway/src/live_voice_token*"
      - "services/gateway/src/call_history/**"
      - "services/gateway/src/incoming_calls/**"
      - ".github/workflows/communication-regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/lib/src/screens/chat/**"
      - "apps/mobile/lib/src/core/voice_note_recorder.dart"
      - "apps/mobile/lib/src/core/live_voice_session.dart"
      - "apps/mobile/lib/src/ui/components/voice_note_composer.dart"
      - "apps/mobile/lib/src/state/ai_chat_state.dart"
      - "apps/mobile/lib/src/calls/**"
      - "services/gateway/src/live_voice_token.ts"
      - "services/gateway/src/incoming_calls/**"
      - "services/gateway/src/call_history/**"
      - ".github/workflows/communication-regression.yml"

permissions: {contents: read}

jobs:
  gateway-chat-and-call-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env: {POSTGRES_DB: masanawa_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d masanawa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MASANAWA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masanawa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: "12.8.2", run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: "24", cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - name: Compile actual production Gateway and dependencies
        run: pnpm --filter @masanawa/gateway-service... build
      - name: Authenticated agent conversation and live voice token
        run: >-
          pnpm exec vitest run
          services/gateway/src/agent_conversation_route.test.ts
          services/gateway/src/live_voice_token.test.ts
          services/gateway/src/paid_voice.test.ts
          services/gateway/src/paid_voice_routes.test.ts
      - name: Real PostgreSQL call lifecycle, incoming grants and account-fenced history
        run: >-
          pnpm exec vitest run
          services/gateway/src/call_history
          services/gateway/src/incoming_calls

  flutter-message-recording-and-live-call:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Text chat, finite M4A recording, playback, live WebSocket, call and incoming history
        run: >-
          flutter test --no-pub --reporter expanded
          test/agent_experience_test.dart
          test/agent_recovery_test.dart
          test/voice_note_recorder_test.dart
          test/voice_note_composer_test.dart
          test/ai_chat_voice_actions_test.dart
          test/audio_failure_test.dart
          test/live_voice_session_test.dart
          test/live_pcm_audio_test.dart
          test/call_lifecycle_reporter_test.dart
          test/call_history_transport_test.dart
          test/calls_screen_test.dart
          test/incoming_call_test.dart
          test/incoming_call_transport_test.dart
          test/incoming_call_coordinator_test.dart
          test/incoming_call_screen_test.dart
      - name: Strict analysis of affected Flutter customer journeys
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/src/core/voice_note_recorder.dart
          lib/src/core/live_voice_session.dart
          lib/src/core/live_pcm_audio.dart
          lib/src/ui/components/voice_note_composer.dart
          lib/src/screens/chat/ai_chat_screen.dart
          lib/src/state/ai_chat_state.dart
          lib/src/agents/masanawa_transport.dart
          test/voice_note_composer_test.dart
          test/voice_note_recorder_test.dart
          test/live_voice_session_test.dart
          test/ai_chat_voice_actions_test.dart
