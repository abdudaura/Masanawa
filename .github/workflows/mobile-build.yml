name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/admin_mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/admin_mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Integration PRs are advisory for source progress. Main remains strict.
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'integration/rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      # Pinned channel on purpose: exact SDK pins rot fast. Pin an exact
      # flutter-version once releases stabilize around this app.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install
        id: install
        run: flutter pub get
      - name: Analyze
        id: analyze
        # Record diagnostic failures; integration PRs do not block implementation.
        run: flutter analyze --no-fatal-infos
      - name: Test
        id: test
        # Continue independent stages and publish the real evidence.
        if: ${{ !cancelled() }}
        run: flutter test
      - name: Phone (production APK)
        id: apk
        # Continue independent stages and publish the real evidence.
        if: ${{ !cancelled() }}
        run: flutter build apk --release --dart-define=API_BASE_URL=https://masanawa-gateway-production.up.railway.app --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production.up.railway.app
      - name: Web (release)
        id: web
        # Continue independent stages and publish the real evidence.
        if: ${{ !cancelled() }}
        run: flutter build web --release --dart-define=API_BASE_URL=https://masanawa-gateway-production.up.railway.app --dart-define=AGENT_BASE_URL=https://masanawa-gateway-production.up.railway.app
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-production-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-web
          path: apps/mobile/build/web

      - name: Report consumer app evidence
        if: ${{ always() }}
        run: |
          {
            echo "## Consumer Flutter — source-first evidence"
            echo "PRs into \`integration/rebuild\`: advisory only, failures remain failures. PRs into \`main\`: strict."
            echo "| Command | Recorded outcome |"
            echo "| --- | --- |"
            echo "| flutter pub get | ${{ steps.install.outcome }} |"
            echo "| flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| flutter test | ${{ steps.test.outcome }} |"
            echo "| flutter build apk --release | ${{ steps.apk.outcome }} |"
            echo "| flutter build web --release | ${{ steps.web.outcome }} |"
            echo "Commit: \`$GITHUB_SHA\`. Builds do not prove device, signing or provider qualification."
          } >> "$GITHUB_STEP_SUMMARY"

  admin:
    # Independent Admin job prevents consumer failures hiding Admin readiness.
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'integration/rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/admin_mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Admin dependency install
        id: install
        run: flutter pub get
      - name: Admin analyze
        id: analyze
        if: ${{ !cancelled() }}
        run: flutter analyze --no-fatal-infos
      - name: Admin widget tests
        id: test
        if: ${{ !cancelled() }}
        run: flutter test
      - name: Admin debug APK
        id: apk
        if: ${{ !cancelled() }}
        run: flutter build apk --debug
      - name: Upload admin APK
        if: ${{ steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: masanawa-admin-debug-apk
          path: apps/admin_mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Report admin app evidence
        if: ${{ always() }}
        run: |
          {
            echo "## Admin Flutter — source-first evidence"
            echo "PRs into \`integration/rebuild\`: advisory only; PRs into \`main\`: strict."
            echo "| Command | Recorded outcome |"
            echo "| --- | --- |"
            echo "| flutter pub get | ${{ steps.install.outcome }} |"
            echo "| flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| flutter test | ${{ steps.test.outcome }} |"
            echo "| flutter build apk --debug | ${{ steps.apk.outcome }} |"
            echo "Commit: \`$GITHUB_SHA\`. This debug build does not qualify production."
          } >> "$GITHUB_STEP_SUMMARY"
