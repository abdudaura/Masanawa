name: Mobile Voice Note Regression

on:
  pull_request:
    paths:
      - "apps/mobile/lib/src/screens/chat/ai_chat_screen.dart"
      - "apps/mobile/lib/src/core/voice_note_recorder.dart"
      - "apps/mobile/lib/src/core/audio_failure.dart"
      - "apps/mobile/lib/src/ui/components/voice_note_composer.dart"
      - "apps/mobile/lib/src/agents/masanawa_transport.dart"
      - "apps/mobile/test/voice_note_recorder_test.dart"
      - "apps/mobile/test/voice_note_composer_test.dart"
      - "apps/mobile/test/ai_chat_voice_actions_test.dart"
      - ".github/workflows/mobile-voice-note-regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/lib/src/screens/chat/ai_chat_screen.dart"
      - "apps/mobile/lib/src/core/voice_note_recorder.dart"
      - "apps/mobile/lib/src/core/audio_failure.dart"
      - "apps/mobile/lib/src/ui/components/voice_note_composer.dart"
      - "apps/mobile/lib/src/agents/masanawa_transport.dart"
      - ".github/workflows/mobile-voice-note-regression.yml"

permissions:
  contents: read

jobs:
  voice-note:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Voice recording, composer, chat, and provider token timeout tests
        run: >-
          flutter test --no-pub
          test/voice_note_recorder_test.dart
          test/voice_note_composer_test.dart
          test/ai_chat_voice_actions_test.dart
          test/audio_failure_test.dart
          test/call_lifecycle_reporter_test.dart
      - name: Analyze voice sources and integration (errors and warnings are fatal)
        run: >-
          flutter analyze --no-pub --no-fatal-infos
          lib/src/core/voice_note_recorder.dart
          lib/src/core/audio_failure.dart
          lib/src/ui/components/voice_note_composer.dart
          lib/src/screens/chat/ai_chat_screen.dart
          lib/src/agents/masanawa_transport.dart
          test/voice_note_recorder_test.dart
          test/voice_note_composer_test.dart
          test/ai_chat_voice_actions_test.dart
          test/audio_failure_test.dart
