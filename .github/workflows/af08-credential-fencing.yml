name: AF08 Auth Credential Fencing
on:
  pull_request:
    paths:
      - "apps/mobile/lib/src/core/network/api_client.dart"
      - "apps/mobile/lib/src/state/session_state.dart"
      - "apps/mobile/test/auth_credential_fencing_test.dart"
      - "apps/mobile/test/session_state_test.dart"
      - "apps/mobile/test/api_client_error_test.dart"
      - ".github/workflows/af08-credential-fencing.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/lib/src/core/network/api_client.dart"
      - "apps/mobile/lib/src/state/session_state.dart"
      - "apps/mobile/test/auth_credential_fencing_test.dart"
      - "apps/mobile/test/session_state_test.dart"
      - ".github/workflows/af08-credential-fencing.yml"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Flutter packages
        run: flutter pub get
      - name: Session/HTTP and mounted account regression
        run: >-
          flutter test --no-pub --reporter expanded
          test/auth_credential_fencing_test.dart
          test/session_state_test.dart
          test/api_client_error_test.dart
          test/own_profile_transport_test.dart
          test/wallet_account_fencing_test.dart
      - name: Focused Dart analyzer
        run: >-
          dart analyze
          lib/src/core/network/api_client.dart
          lib/src/state/session_state.dart
          test/auth_credential_fencing_test.dart
          test/session_state_test.dart
