name: MUI-03 focused Flutter verification

on:
  push:
    branches:
      - validation/mui03-flutter-20261012-gpt6
    paths:
      - ".github/workflows/mui03-validation-20261012.yml"
      - "apps/mobile/**"

permissions:
  contents: read

jobs:
  chats-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Mounted MUI-03 Chats query, offline, owner and open widget tests
        run: flutter test --reporter expanded test/ui/mui03_chats_search_test.dart
      - name: Existing MUI-01 presentation and shell regression tests
        if: success() || failure()
        run: flutter test --reporter expanded test/ui/mui01_presentation_test.dart test/app_shell_route_compatibility_test.dart
      - name: Analyze changed MUI-03 Dart source and tests
        if: success() || failure()
        run: dart analyze lib/src/screens/chat/chat_list_screen.dart test/ui/mui03_chats_search_test.dart
