name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "12.8.2"
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Bootstrap lockfile evidence
        run: |
          printf 'MASANAWA_PNPM_LOCK_B64='
          base64 -w0 pnpm-lock.yaml
          echo
      - name: Check
        run: pnpm check
