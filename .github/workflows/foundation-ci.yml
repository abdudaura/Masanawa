name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Source-first owner decision: tests and build failures remain visible, but
    # cannot veto a PR into the explicitly non-deploying integration baseline.
    # All PRs targeting main remain strict. Release qualification is separate.
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'integration/rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: masanawa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d masanawa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASANAWA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masanawa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "12.8.2"
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck
      - name: Test
        id: vitest
        # Continue independent checks; the integration-PR job is advisory.
        if: ${{ !cancelled() }}
        run: pnpm test:ci
      - name: Provider qualification tooling tests
        id: provider
        # Preserve actual provider tooling results separately from live provider proof.
        if: ${{ !cancelled() }}
        run: >-
          node --test
          scripts/flutterwave-billing-qualification-gate.test.mjs
          scripts/flutterwave-billing-production-qualification.test.mjs
          scripts/nowpayments-production-qualification.test.mjs
      - name: Build
        id: build
        # Execute despite failures elsewhere and report the outcome.
        if: ${{ !cancelled() }}
        run: pnpm build

      - name: Publish actual gate results
        if: ${{ always() }}
        run: |
          {
            echo "## Foundation CI — source-first evidence"
            echo "This job is **advisory only** for PRs targeting \`integration/rebuild\`. Failed checks are **NOT** passes. PRs to \`main\` remain strict, and no financial/production gate is relaxed."
            echo ""
            echo "| Command | Recorded outcome |"
            echo "| --- | --- |"
            echo "| Dependency install | ${{ steps.install.outcome }} |"
            echo "| TypeScript | ${{ steps.typecheck.outcome }} |"
            echo "| Vitest / PostgreSQL | ${{ steps.vitest.outcome }} |"
            echo "| Provider qualification tooling | ${{ steps.provider.outcome }} |"
            echo "| Package build | ${{ steps.build.outcome }} |"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`; source gates are distinct from device, financial provider, staging-restore and release gates."
          } >> "$GITHUB_STEP_SUMMARY"
