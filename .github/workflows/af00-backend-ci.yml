name: AF00 Backend Composition CI

on:
  pull_request:
    paths:
      - ".github/workflows/af00-backend-ci.yml"
      - "packages/feed/**"
      - "packages/masana/**"
      - "packages/rooms/**"
      - "services/gateway/src/app.ts"
      - "services/gateway/src/main.ts"
      - "services/gateway/src/modules/home_feed/**"
      - "services/gateway/src/modules/masana_chat/**"
      - "services/gateway/src/modules/rooms/**"
      - "adapters/storage/postgres/src/home_feed/**"
      - "adapters/storage/postgres/src/masana/**"
      - "adapters/storage/postgres/src/masana_chat/**"
      - "adapters/storage/postgres/src/rooms/**"
      - "adapters/storage/postgres/src/migrations.ts"
      - "adapters/storage/postgres/src/readiness.ts"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: masanawa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d masanawa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MASANAWA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/masanawa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "12.8.2"
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Focused PostgreSQL and Gateway TypeScript
        run: |
          pnpm --filter @masanawa/feed typecheck
          pnpm --filter @masanawa/masana typecheck
          pnpm --filter @masanawa/rooms typecheck
          pnpm --filter @masanawa/postgres typecheck
          pnpm --filter @masanawa/gateway-service typecheck
          pnpm --filter @masanawa/worker-service typecheck
      - name: Status Rooms C10 and migration focused Vitest
        if: always()
        run: |
          pnpm exec vitest run \
            packages/feed/src \
            packages/rooms/src \
            packages/masana/src \
            adapters/storage/postgres/src/home_feed \
            adapters/storage/postgres/src/masana_chat \
            adapters/storage/postgres/src/rooms \
            services/gateway/src/modules/home_feed \
            services/gateway/src/modules/masana_chat \
            services/gateway/src/modules/rooms \
            --maxWorkers=2
      - name: Production graph build
        if: always()
        run: |
          pnpm --filter @masanawa/gateway-service... build
          pnpm --filter @masanawa/worker-service... build
