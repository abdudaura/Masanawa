name: Materialize Masana photo portraits
on:
  push:
    branches:
      - fix/owner-mobile-corrections-20261014
    paths:
      - 'apps/mobile/assets/masana/portraits/source-atlas.part*.txt'
      - 'scripts/masana/materialize_portraits.py'
      - '.github/workflows/masana-photo-portraits.yml'
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Materialize all 26 identity-bound portraits
        run: python scripts/masana/materialize_portraits.py
      - name: Verify portraits
        shell: bash
        run: |
          if test ! -e apps/mobile/assets/masana/portraits/gwani.webp; then
            echo 'Waiting for all atlas parts'
            exit 0
          fi
          test "$(find apps/mobile/assets/masana/portraits -name '*.webp' | wc -l)" -eq 26
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('apps/mobile/assets/masana/portraits')
          data=json.loads((root/'manifest.json').read_text())
          assert len(data['portraits'])==26
          assert all((root/(x['key']+'.webp')).stat().st_size>500 for x in data['portraits'])
          PY
      - name: Commit artwork on source branch
        shell: bash
        run: |
          git config user.name 'Masanawa artwork automation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A apps/mobile/assets/masana/portraits/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(masana): materialize 26 photorealistic AI profile portraits'
            git push origin HEAD:fix/owner-mobile-corrections-20261014
          fi
