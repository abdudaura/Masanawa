name: Rebuild Railway Production

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Railway project name
        required: false
        default: masanawa
      confirm_rebuild:
        description: Type REBUILD to confirm infrastructure reconciliation
        required: true

permissions:
  contents: read

concurrency:
  group: railway-production-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ inputs.confirm_rebuild == 'REBUILD' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      CALL_GATEWAY_TOKEN: ${{ secrets.CALL_GATEWAY_TOKEN }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      FLUTTERWAVE_ENCRYPTION_KEY: ${{ secrets.FLUTTERWAVE_ENCRYPTION_KEY }}
      FLUTTERWAVE_OPERATOR_TEST_TOKEN: ${{ secrets.FLUTTERWAVE_OPERATOR_TEST_TOKEN }}
      FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
      FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
      FLUTTERWAVE_WEBHOOK_SECRET_HASH: ${{ secrets.FLUTTERWAVE_WEBHOOK_SECRET_HASH }}
      MASANAWA_GEMINI_CREDENTIALS_JSON: ${{ secrets.MASANAWA_GEMINI_CREDENTIALS_JSON }}
      MASANAWA_AUTH_OTP_PEPPER: ${{ secrets.MASANAWA_AUTH_OTP_PEPPER }}
      MASANAWA_BILLING_ACTION_SECRET: ${{ secrets.MASANAWA_BILLING_ACTION_SECRET }}
      MASANAWA_FLUTTERWAVE_RELAY_TOKEN: ${{ secrets.MASANAWA_FLUTTERWAVE_RELAY_TOKEN }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      NOWPAYMENTS_PAYOUT_EMAIL: ${{ secrets.NOWPAYMENTS_PAYOUT_EMAIL }}
      NOWPAYMENTS_PAYOUT_PASSWORD: ${{ secrets.NOWPAYMENTS_PAYOUT_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      WPP_SESSION: ${{ secrets.WPP_SESSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tooling
        run: |
          npm install --global @railway/cli
          corepack enable
          corepack prepare pnpm@12.8.2 --activate
          pnpm install --frozen-lockfile

      - name: Validate portable secret contract
        run: node scripts/railway/validate-portable-secrets.mjs

      - name: Rebuild Railway runtime
        shell: bash
        run: bash scripts/railway/rebuild-production.sh "${{ inputs.project_name }}"
