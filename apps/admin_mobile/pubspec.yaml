name: masanawa_admin
description: "Masanawa Admin — mobile operations console."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/masanawa_agent_logo.png"
  adaptive_icon_background: "#0A6FFA"
  adaptive_icon_foreground: "assets/brand/masanawa_agent_logo.png"
  min_sdk_android: 21
flutter_native_splash:
  color: "#0A6FFA"
  image: "assets/brand/masanawa_agent_logo.png"
  color_dark: "#0A6FFA"
  image_dark: "assets/brand/masanawa_agent_logo.png"
  android_12:
    color: "#0A6FFA"
    image: "assets/brand/masanawa_agent_logo.png"
    color_dark: "#0A6FFA"
    image_dark: "assets/brand/masanawa_agent_logo.png"
