org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Avoid aapt2 StringPool class-init race in Gradle's instrumenting classloader
android.enableParallelResourceProcessing=false
# Extended network timeouts for unstable connections
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=300000
systemProp.https.protocols=TLSv1.2,TLSv1.3
